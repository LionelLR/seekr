[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seekr"
version = "0.1.0"
description = "Semantic search inside videos"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "openai>=1.30.0",
    "google-generativeai>=0.7.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "openai-whisper>=20231117",
    "yt-dlp>=2024.5.27",
    "sentence-transformers>=3.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
]

[project.scripts]
seekr = "main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools]
py-modules = ["main"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
